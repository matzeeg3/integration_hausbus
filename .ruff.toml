# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    # formatter compatibility
    "COM812",
    "ISC001",
    # docstrings - not enforced in this project
    "D",
    # type annotations - not enforced in this project
    "ANN",
    # naming: pyhausbus library uses camelCase, cannot rename
    "N802",
    "N803",
    "N806",
    # line length - many lines are intentionally long
    "E501",
    # logging f-strings - intentional use
    "G004",
    # type-checking imports - not required
    "TC001",
    "TC002",
    # exception style - intentional patterns
    "BLE001",
    "EM101",
    "TRY003",
    # unused arguments - required by HA interface contracts
    "ARG001",
    "ARG002",
    # tests: assert and private member access are expected
    "S101",
    "SLF001",
    # boolean positional argument - intentional
    "FBT001",
    # magic values - intentional
    "PLR2004",
    # commented-out code - intentional
    "ERA001",
    # type-checking blocks - not required
    "TC003",
    # ambiguous unicode characters in docstrings
    "RUF002",
    # too many branches/statements/arguments - existing code structure
    "PLR0912",
    "PLR0913",
    "PLR0915",
    # exception f-string style
    "EM102",
    # asyncio event pattern - existing poll loop is intentional
    "ASYNC110",
    # Python 3.12+ type keyword - keep TypeAlias for compatibility
    "UP040",
    # try/except style
    "TRY300",
    "TRY400",
    # ternary operator - readability preference
    "SIM108",
    # pathlib - os.path used in test setup
    "PTH100",
    "PTH111",
    "PTH118",
    "PTH120",
    # import not at top - test file path setup
    "E402",
    # unused variable assignment for side-effect calls
    "F841",
    # loop variable naming
    "B007",
    # dict performance - intentional clarity
    "PERF102",
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
